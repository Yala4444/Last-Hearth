name: Last Hearth CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

concurrency:
  group: last-hearth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate-and-build-web:
    name: Validate + Web build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Validate project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-import.log; then
            echo "GDScript parse errors detected"
            exit 1
          fi

      - name: Boot game briefly
        shell: bash
        run: |
          set -o pipefail
          timeout 8s godot --headless --path . 2>&1 | tee /tmp/godot-boot.log || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then
            exit "${code}"
          fi
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script|Invalid call|Invalid get index" /tmp/godot-boot.log; then
            echo "Runtime script errors detected"
            exit 1
          fi

      - name: Progression sanity test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/progression_sanity.gd 2>&1 | tee /tmp/progression-sanity.log
          grep -q "PROGRESSION_SANITY_OK" /tmp/progression-sanity.log

      - name: Visual sprint 1 sanity test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/visual_sprint1_sanity.gd 2>&1 | tee /tmp/visual-sprint1.log
          grep -q "VISUAL_SPRINT1_SANITY_OK" /tmp/visual-sprint1.log

      - name: Chapter 1 adventure sanity test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/chapter1_adventure_sanity.gd 2>&1 | tee /tmp/chapter1-adventure.log
          grep -q "CHAPTER1_ADVENTURE_SANITY_OK" /tmp/chapter1-adventure.log

      - name: Hub settlement sanity test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/hub_settlement_sanity.gd 2>&1 | tee /tmp/hub-settlement.log
          grep -q "HUB_SETTLEMENT_SANITY_OK" /tmp/hub-settlement.log

      - name: Route variation sanity test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/route_variation_sanity.gd 2>&1 | tee /tmp/route-variation.log
          grep -q "ROUTE_VARIATION_SANITY_OK" /tmp/route-variation.log

      - name: v0.15 clarity sanity test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/v015_clarity_sanity.gd 2>&1 | tee /tmp/v015-clarity.log
          grep -q "V015_CLARITY_SANITY_OK" /tmp/v015-clarity.log

      - name: v0.16 region memory sanity test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/v016_region_memory_sanity.gd 2>&1 | tee /tmp/v016-region-memory.log
          grep -q "V016_REGION_MEMORY_SANITY_OK" /tmp/v016-region-memory.log

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Verify Web output
        run: |
          test -f build/web/index.html
          test -f build/web/index.wasm
          ls -lah build/web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Last-Hearth-Web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
